
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-ai-backend"
version = "0.1.0"
description = "AI-assisted engineering incident analysis backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
